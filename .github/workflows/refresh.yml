# Refreshes the live snapshot every hour: fetches new sensor data, re-runs all models,
# rebuilds docs/ and commits it. Visitors only load the static snapshot (no API calls).
# Setup: repo Settings -> Secrets and variables -> Actions -> New secret OPENAQ_API_KEY
name: Refresh live forecast
on:
  schedule:
    - cron: "20 * * * *"   # hourly: sensors report hourly, so this is as fresh as the data gets
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install (CPU-only PyTorch)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install requests pandas numpy scikit-learn chronos-forecasting
      - name: Cache Chronos model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: chronos-bolt-small
      - name: Fetch data and forecast
        env:
          OPENAQ_API_KEY: ${{ secrets.OPENAQ_API_KEY }}
        run: |
          # Each step runs even if an earlier one fails; the site is rebuilt from whatever
          # succeeded (older JSON is kept for the rest), and the job is marked failed at the end.
          failed=""
          for s in train_station compare_models map_forecast; do
            echo "::group::$s"
            python -u $s.py || { echo "::error::$s.py failed"; failed="$failed $s"; }
            echo "::endgroup::"
          done
          python -u build_site.py
          echo "FAILED=$failed" >> "$GITHUB_ENV"
      - name: Commit snapshot
        run: |
          git config user.name "smog-desk-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs forecast_school.json station_results.json compare_results.json map_results.json data/openaq_*.csv
          git diff --cached --quiet && echo "no changes" || (git commit -m "Live snapshot $(date -u +'%Y-%m-%d %H:%M UTC')" && git pull --rebase -q && git push)
      - name: Report failed steps
        if: env.FAILED != ''
        run: echo "::error::These steps failed:${FAILED}" && exit 1
